name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Prepare the standalone build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
              throw 'Tag and VERSION differ.'
          }
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --only-binary=:all: -r requirements.txt -r requirements-build.txt
          .\.venv\Scripts\python.exe -m pip check
      - name: Prepare Vulkan build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.4.363.0'
          $name = "vulkansdk-windows-X64-$version.exe"
          $installer = Join-Path $env:RUNNER_TEMP $name
          $sdk = Join-Path $env:RUNNER_TEMP 'SubtitleVulkanSDK'
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$version/windows/$name" -OutFile $installer
          $expected = '94a82d378f7a5e3e54c9db7d2fb7016af136e14ac0a18dbf0f2f67a36352d141'
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $expected) { throw 'Vulkan SDK digest mismatch.' }
          $options = @('--root', ('"' + $sdk + '"'), '--accept-licenses', '--default-answer',
                       '--confirm-command', 'install', 'copy_only=1')
          $process = Start-Process -FilePath $installer -ArgumentList $options -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0 -or -not (Test-Path "$sdk/Bin/glslc.exe")) { throw 'Vulkan SDK extraction failed.' }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
      - name: Compile the package and installer
        shell: powershell
        run: |
          .\build_windows.ps1
          .\build_installer.ps1
      - name: Test the installed build
        shell: pwsh
        run: .\tools\smoke_installer.ps1
      - name: Write checksum
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $name = "SubtitleForEveryone-Setup-$version-x64.exe"
          $hash = (Get-FileHash "installer/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content "installer/$name.sha256" -Encoding ascii -NoNewline
          Copy-Item dist/SubtitleForEveryone/_internal/licenses/build-dependencies.txt installer/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SubtitleForEveryone-Windows-x64
          path: |
            installer/*.exe
            installer/*.sha256
            installer/build-dependencies.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SubtitleForEveryone-Windows-x64
      - name: Publish to this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check *.sha256
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "SubtitleForEveryone $GITHUB_REF_NAME" --generate-notes --latest \
            ./*.exe ./*.sha256 ./build-dependencies.txt
